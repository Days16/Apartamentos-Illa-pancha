[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_STRIPE_PUBLIC_KEY,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_WHATSAPP_PHONE,VITE_SITE_URL,VITE_TURNSTILE_SITE_KEY,VITE_OG_IMAGE_URL,VITE_CLARITY_PROJECT_ID,VITE_MAPS_URL,VITE_MAPS_EMBED_URL,VITE_MAPS_URL"

[[redirects]]
  from = "/api/frankfurter/*"
  to = "https://api.frankfurter.app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.stripe.com https://*.supabase.co https://api.frankfurter.app https://challenges.cloudflare.com https://api.mymemory.translated.net; img-src 'self' data: https: blob:; frame-src https://js.stripe.com https://challenges.cloudflare.com https://maps.google.com; worker-src blob:; upgrade-insecure-requests"
